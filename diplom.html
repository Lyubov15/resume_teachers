<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Диплом цифровой кафедры</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Стили для страницы просмотра диплома */
    .diploma-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }
    .diploma-container img {
      width: 100%;
      height: auto;
      clip-path: none; 
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #FF0000;
      font-weight: bold;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="diploma-container">
    <a href="index.html#courses" class="back-link">← Вернуться к резюме</a>
    <img src="images/Diplom_1.jpg" alt="Диплом цифровой кафедры - страница 1" />
    <img src="images/Diplom_2.jpg" alt="Диплом цифровой кафедры - страница 2" />
  </div>
</body>
</html>
